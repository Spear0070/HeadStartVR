name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # only used to attach files to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/HeadStartVR.Tests/HeadStartVR.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish src/HeadStartVR/HeadStartVR.csproj -c Release -o publish
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:ContinuousIntegrationBuild=true

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md publish/
          Compress-Archive -Path publish/* -DestinationPath HeadStartVR.zip
          (Get-FileHash HeadStartVR.zip -Algorithm SHA256).Hash.ToLower() + "  HeadStartVR.zip" | Out-File -Encoding ascii HeadStartVR.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: HeadStartVR
          path: |
            HeadStartVR.zip
            HeadStartVR.zip.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HeadStartVR.zip
            HeadStartVR.zip.sha256
          generate_release_notes: true
